services:
  - type: web
    name: shortly-url-api
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Apply migrations, then boot the API on Render's dynamic $PORT.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin the interpreter the codebase is tested against (318-test suite).
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DATABASE_URL
        fromDatabase:
          name: shortly-url-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shortly-url-cache
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # Deterministic: the blueprint names the service, so the URL is known up front.
      - key: BASE_URL
        value: https://shortly-url-api.onrender.com
      # Public demo key (documented in the README) so the demo works out of the box —
      # rotate it for any serious use.
      - key: MASTER_API_KEY
        value: shortly-demo-key-2024
      # Generated automatically on first deploy.
      - key: IP_HASH_SALT
        generateValue: true

databases:
  - name: shortly-url-db
    plan: free
    databaseName: shortly
    user: shortly
    ipAllowList: []  # internal connections only

keyvalueInstances:
  - name: shortly-url-cache
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []  # internal connections only
